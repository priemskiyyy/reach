name: packages-verify

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: packages-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build

      # Packs every package, installs the tarballs into a consumer without any
      # native SDK, React or Query, imports each entry in Node and typechecks it.
      - name: Packed consumer
        run: pnpm verify:packages
